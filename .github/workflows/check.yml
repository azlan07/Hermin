name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s hermin -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: for file in hermin/*.js; do node --check "$file"; done
      - run: python manage.py install --root "$RUNNER_TEMP/hermin-stack" --port 18151 --no-systemd
      - run: python tests/smoke_install.py "$RUNNER_TEMP/hermin-stack" 18151
